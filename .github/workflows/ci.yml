name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build template (WASM)
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Clippy (template)
        run: cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings
      - name: Engine tests
        run: cargo test --locked
      - name: Narrated demo
        run: GS_FAST=1 cargo run --locked --example haunted_payroll 2>/dev/null
